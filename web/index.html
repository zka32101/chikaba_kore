<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="近場コレ - 地元民と訪問者が「いま、この場所で」出会える施設発見プラットフォーム">
  <meta name="theme-color" content="#2196F3">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="近場コレ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Manifest for PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Preload Critical Resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">

  <!-- Font Optimization -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Web App Title -->
  <title>近場コレ - 施設発見プラットフォーム</title>

  <!-- Meta Tags for Social Sharing -->
  <meta property="og:title" content="近場コレ - 施設発見プラットフォーム">
  <meta property="og:description" content="地元民と訪問者が「いま、この場所で」出会える施設発見プラットフォーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chikaba-kore.app">
  <meta property="og:image" content="https://chikaba-kore.app/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="近場コレ">
  <meta name="twitter:description" content="地元で出会える施設発見">

  <!-- Performance Optimization -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    /* Loading Spinner */
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">読み込み中...</div>
    </div>
  </div>

  <!-- Flutter Bootstrap -->
  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('flutter_service_worker.js', {
        scope: '/'
      }).then(reg => {
        console.log('Service Worker registered successfully:', reg);
      }).catch(err => {
        console.warn('Service Worker registration failed:', err);
      });
    }

    // Detect offline/online status
    window.addEventListener('offline', () => {
      console.warn('App is offline');
    });

    window.addEventListener('online', () => {
      console.log('App is online');
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
