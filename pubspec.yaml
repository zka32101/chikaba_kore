name: chikaba_kore
description: "近場コレ — ビジュアル発見 × 信頼できるクチコミ × 保存・決定一元化"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.4
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  firebase_storage: ^12.4.4

  # ローカルDB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP通信
  dio: ^5.8.0+1

  # 地図
  google_maps_flutter: ^2.10.0

  # 画像
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # 通知
  flutter_local_notifications: ^18.0.1

  # JSON
  json_annotation: ^4.9.0

  # 環境変数
  flutter_dotenv: ^5.2.1

  # ユーティリティ
  logger: ^2.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  shimmer: ^3.0.0
  gap: ^3.0.1
  go_router: ^14.8.1
  share_plus: ^10.1.2
  google_sign_in: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
