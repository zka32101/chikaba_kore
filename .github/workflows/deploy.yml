name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Restore google-services.json from Secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json restored from GitHub Secret"
          else
            echo "⚠️  GOOGLE_SERVICES_JSON secret not found - build may fail"
          fi

      - name: Ensure Gradle wrapper JAR
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, generating..."
            GRADLE_VERSION=$(sed -n 's|.*/gradle-\(.*\)-all\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
            echo "Using Gradle version: $GRADLE_VERSION"
            TMP=$(mktemp -d)
            touch "$TMP/settings.gradle"
            (cd "$TMP" && gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all -q 2>&1 || true)
            if [ -f "$TMP/gradle/wrapper/gradle-wrapper.jar" ]; then
              mkdir -p gradle/wrapper
              cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
              echo "gradle-wrapper.jar generated successfully"
            else
              echo "Warning: Failed to generate gradle-wrapper.jar using gradle command"
            fi
            rm -rf "$TMP"
          else
            echo "gradle-wrapper.jar already exists"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Prepare artifacts
        run: |
          mkdir -p build/outputs
          if [ -f "build/app/outputs/flutter-app-release.apk" ]; then
            cp build/app/outputs/flutter-app-release.apk build/outputs/chikaba-kore-${GITHUB_REF#refs/tags/}.apk
            echo "APK generated: chikaba-kore-${GITHUB_REF#refs/tags/}.apk"
          fi
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab build/outputs/chikaba-kore-${GITHUB_REF#refs/tags/}.aab
            echo "AAB generated: chikaba-kore-${GITHUB_REF#refs/tags/}.aab"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/outputs/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release IPA
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - name: Create iOS build artifact
        run: |
          mkdir -p build/outputs
          cd build/ios/Release-iphoneos
          zip -r ../../outputs/chikaba-kore-ios-${GITHUB_REF#refs/tags/}.zip Payload/
        continue-on-error: true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/outputs/
          retention-days: 30
        continue-on-error: true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release
        continue-on-error: true

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 30
        continue-on-error: true

  create-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release summary
        run: |
          echo "✨ Release ${{ steps.version.outputs.VERSION }}" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 📦 Downloads" >> /tmp/release-notes.md
          echo "- **Android APK**: [Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/chikaba-kore-${{ steps.version.outputs.VERSION }}.apk)" >> /tmp/release-notes.md
          echo "- **iOS Build**: Available in Artifacts" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 📝 Changelog" >> /tmp/release-notes.md
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes." >> /tmp/release-notes.md

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      
      - name: Run Android Emulator Tests
        uses: zka32101/yourwish/.github/workflows/android-emulator-test.yml@main
        with:
          app-path: '.'
          test-command: 'flutter test'
